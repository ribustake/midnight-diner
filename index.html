
<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>午前2時の食堂</title>
<style>
body{margin:0;background:#21150e;color:white;font-family:sans-serif}
canvas{display:block;width:100vw;height:100vh}
#msg{position:fixed;top:20px;left:20px;background:#21150ecc;padding:15px;border-radius:10px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="msg">🌙 午前2時の食堂<br>店内表示テスト</div>
<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
function draw(){
c.width=innerWidth;
c.height=innerHeight;
let w=c.width,h=c.height;
ctx.fillStyle="#a5784b";
ctx.fillRect(0,0,w,h);
ctx.fillStyle="#39291f";
ctx.beginPath();
ctx.moveTo(0,h*.55);
ctx.lineTo(w,h*.55);
ctx.lineTo(w,h);
ctx.lineTo(0,h);
ctx.fill();
ctx.fillStyle="#805333";
ctx.fillRect(w*.15,h*.3,w*.7,h*.3);
ctx.fillStyle="#c99a64";
ctx.fillRect(w*.1,h*.55,w*.8,h*.08);
ctx.fillStyle="#4a3326";
ctx.fillRect(w*.15,h*.63,w*.7,h*.22);
ctx.fillStyle="#ffdf9a";
ctx.beginPath();
ctx.arc(w*.5,h*.12,35,0,Math.PI*2);
ctx.fill();
ctx.fillStyle="white";
ctx.font="bold 20px sans-serif";
ctx.fillText("厨房のカウンター",w*.2,h*.5);
}
draw();
addEventListener("resize",draw);
</script>
</body>
</html>
