<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>午前2時の食堂 近距離修正版</title><style>*{box-sizing:border-box}body{margin:0;background:#130e0a;color:#fff;font-family:system-ui;overflow:hidden;touch-action:none}canvas{width:100vw;height:100dvh;display:block}#hud{position:fixed;top:12px;left:12px;background:#170e09dd;border:1px solid #ba8b57;border-radius:10px;padding:10px;font-size:13px;line-height:1.7}#joy{position:fixed;bottom:25px;left:22px;width:118px;height:118px;border:2px solid #d6b185;border-radius:50%;background:#48311f99;touch-action:none}#dot{position:absolute;left:39px;top:39px;width:36px;height:36px;border-radius:50%;background:#e2bb89}#act{position:fixed;right:24px;bottom:40px;width:90px;height:90px;border-radius:50%;background:#65432c;color:#fff;border:2px solid #dfb784;font-size:17px}#msg{position:fixed;bottom:172px;left:14%;width:72%;text-align:center;background:#1e120cdd;padding:10px;border-radius:9px;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="hud">🌙 午前2時の食堂<br>午前2:00 ☔ 雨<br>左：移動　右：見回す</div><div id="msg">店内を見回してみよう。</div><div id="joy"><div id="dot"></div></div><button id="act">調べる</button><script>
const c=document.getElementById('game'),g=c.getContext('2d');
const map=['##############','#............#','#............#','#............#','#............#','#............#','#............#','#............#','#............#','##############'];
// お客さん側の通路から厨房を見渡す。カウンターは衝突しない装飾として描く
let x=7,y=7.2,a=-Math.PI/2,mx=0,my=0,t=0;
const objects=[{x:4,y:3.1,type:'fridge'},{x:6,y:3.1,type:'stove'},{x:9,y:3.1,type:'shelf'},{x:5,y:4.7,type:'cat'},{x:8,y:4.7,type:'bowls'},{x:10,y:4.7,type:'bottles'},{x:4,y:5.3,type:'stool'},{x:7,y:5.3,type:'stool'},{x:10,y:5.3,type:'stool'}];
function resize(){c.width=innerWidth;c.height=innerHeight}resize();addEventListener('resize',resize);
function wall(xx,yy){return map[Math.floor(yy)]?.[Math.floor(xx)]!=='.'}
function blocked(xx,yy){if(wall(xx,yy))return true; if(xx>3.4&&xx<10.6&&yy>4.55&&yy<5.02)return true; for(const o of objects){if(o.type==='stool')continue;if(Math.hypot(xx-o.x,yy-o.y)<.34)return true;}return false;}
function rectangle(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}
function drawObject(o,sx,sz){let s=Math.max(10,sz),h=c.height;g.save();g.translate(sx,h*.51+s*.27);g.scale(s/120,s/120);function r(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}
if(o.type==='fridge'){r(-35,-115,70,135,'#8d9698');r(-30,-110,60,125,'#b9c0be');r(21,-70,5,28,'#505758');r(-30,-30,60,4,'#616b6d')}
if(o.type==='stove'){r(-53,-54,106,75,'#5e6665');r(-55,-62,110,12,'#b7b9af');r(-33,-87,66,26,'#8e9692');r(-24,-95,48,11,'#d3d1c5');r(-38,-113,7,24,'#ccc9bd');r(29,-113,7,24,'#ccc9bd');r(-28,-45,12,8,'#d2a05c');r(10,-45,12,8,'#d2a05c')}
if(o.type==='shelf'){r(-52,-110,104,10,'#5c3922');r(-52,-60,104,10,'#5c3922');r(-52,-10,104,10,'#5c3922');for(let i=0;i<4;i++){r(-40+i*23,-94,18,29,'#d2c8ac');r(-40+i*23,-44,18,29,'#9c9c8a')}}
if(o.type==='cat'){r(-23,-54,46,62,'#f6e6c9');r(-27,-92,54,46,'#fff0d8');r(-25,-106,17,25,'#fff0d8');r(9,-106,17,25,'#fff0d8');r(-15,-73,5,5,'#3e3027');r(10,-73,5,5,'#3e3027');r(-5,-62,10,5,'#d9948a');r(-25,-18,50,10,'#b43d2b')}
if(o.type==='bowls'){for(let i=0;i<4;i++){r(-38,-20-i*16,76,14,'#e9e3d4');r(-30,-16-i*16,60,4,'#41637c')}}
if(o.type==='bottles'){for(let i=0;i<4;i++){r(-38+i*23,-60,17,55,['#65452b','#a97134','#393f2e','#b66a35'][i]);r(-33+i*23,-69,8,11,'#ddd4be')}}
if(o.type==='stool'){r(-32,-35,64,12,'#8b4d2c');r(-25,-23,9,47,'#583b2b');r(16,-23,9,47,'#583b2b')}
g.restore()}
function draw(){let w=c.width,h=c.height;t++;let ceil=g.createLinearGradient(0,0,0,h*.55);ceil.addColorStop(0,'#20140f');ceil.addColorStop(1,'#59402c');g.fillStyle=ceil;g.fillRect(0,0,w,h*.55);let floor=g.createLinearGradient(0,h*.5,0,h);floor.addColorStop(0,'#9b7350');floor.addColorStop(1,'#211710');g.fillStyle=floor;g.fillRect(0,h*.5,w,h*.5);
// 床板の奥行き
for(let z=1;z<15;z++){let yy=h*.5+h/(z*1.3);if(yy<h){rectangle(0,yy,w,Math.max(1,6/z),'#5e402c88')}}
const step=3,depth=[];
for(let sx=0;sx<w;sx+=step){let ra=a+Math.atan((sx/w-.5)*1.3),dx=Math.cos(ra),dy=Math.sin(ra),d=.03,xx=0,yy=0;while(d<20){xx=x+dx*d;yy=y+dy*d;if(wall(xx,yy))break;d+=.035}let dist=Math.max(.1,d*Math.cos(ra-a));depth[Math.floor(sx/step)]=dist;let size=Math.min(h*4,h/(dist*.66)),top=h*.5-size*.5;let shade=Math.max(.35,1-d/18),edge=Math.abs(xx-Math.round(xx))<.05||Math.abs(yy-Math.round(yy))<.05;let rgb=edge?[78,48,29]:[145,99,62];rectangle(sx,top,step+1,size,`rgb(${rgb.map(v=>Math.floor(v*shade)).join(',')})`);rectangle(sx,top+size*.79,step+1,Math.max(2,size*.045),'#563620');
// 奥の壁に窓と雨を描く
if(yy<1.03&&xx>2.5&&xx<11.5){let pane=Math.floor(xx*2)%4;rectangle(sx,top+size*.25,step+1,size*.35,pane===0?'#513b30':'#26323b');if(pane!==0&&Math.floor(sx/11+t/14)%5===0)rectangle(sx,top+size*.29,1,Math.max(3,size*.18),'#a9c5d277')}
}
// 木製カウンター。位置は奥の厨房側、視界を塞がない低さ
const decor=[{x:7,y:4.85,type:'counter'}];
let visible=[];for(let o of objects.concat(decor)){let dx=o.x-x,dy=o.y-y,dist=Math.hypot(dx,dy),ang=Math.atan2(Math.sin(Math.atan2(dy,dx)-a),Math.cos(Math.atan2(dy,dx)-a));if(Math.abs(ang)<.85&&dist<14){let sx=w*(.5+Math.tan(ang)/1.3),idx=Math.max(0,Math.min(depth.length-1,Math.floor(sx/step)));if(dist<depth[idx]+.6)visible.push({o,sx,dist})}}visible.sort((a,b)=>b.dist-a.dist);
for(let v of visible){let size=Math.min(h*2.8,h/(Math.max(.4,v.dist)*.66));if(v.o.type==='counter'){let ww=Math.min(w*1.6,size*5),hh=size*.28;rectangle(v.sx-ww/2,h*.52-hh*.25,ww,hh,'#7e4a2a');rectangle(v.sx-ww/2,h*.52-hh*.25,ww,hh*.16,'#d4a06a');for(let j=0;j<9;j++)rectangle(v.sx-ww/2+j*ww/9,h*.52,2,hh*.55,'#58341f')}else drawObject(v.o,v.sx,size)}
// 天井の暖色照明
let glow=g.createRadialGradient(w*.5,h*.18,5,w*.5,h*.18,h*.3);glow.addColorStop(0,'#ffe2a355');glow.addColorStop(1,'#ffe2a300');g.fillStyle=glow;g.fillRect(0,0,w,h*.55);rectangle(w*.5-2,0,4,h*.12,'#4b3022');rectangle(w*.5-27,h*.12,54,28,'#f2cb88');rectangle(w*.5-30,h*.12,60,5,'#6e462a');g.font='22px system-ui';g.fillStyle='#fff5dc';g.fillText('+',w/2-7,h/2+7)}
function loop(){let speed=.045,nx=x+(Math.cos(a)*my-Math.sin(a)*mx)*speed,ny=y+(Math.sin(a)*my+Math.cos(a)*mx)*speed;if(!blocked(nx,y))x=nx;if(!blocked(x,ny))y=ny;draw();requestAnimationFrame(loop)}loop();
const joy=document.getElementById('joy'),dot=document.getElementById('dot');function stick(e){let r=joy.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/43,dy=(e.clientY-r.top-r.height/2)/43,len=Math.max(1,Math.hypot(dx,dy));mx=dx/len;my=-dy/len;dot.style.transform=`translate(${mx*35}px,${-my*35}px)`}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);stick(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))stick(e)});function stop(){mx=my=0;dot.style.transform=''}joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);let last=null;c.addEventListener('pointerdown',e=>{last=e.clientX;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(last!==null){a+=(e.clientX-last)*.006;last=e.clientX}});c.addEventListener('pointerup',()=>last=null);c.addEventListener('pointercancel',()=>last=null);document.getElementById('act').onclick=()=>{let nearest=null,nd=1.5;for(const o of objects){let d=Math.hypot(o.x-x,o.y-y);if(d<nd){nd=d;nearest=o}}document.getElementById('msg').textContent=nearest?.type==='cat'?'招き猫が静かにこちらを見ている。':nearest?'厨房の道具を調べた。':'鍋からいい香りがする。……午前2時、開店。';};
</script></body></html>
