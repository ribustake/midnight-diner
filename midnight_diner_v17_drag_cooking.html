 if(stage===3){

function startCookDrag(e){
 if(!cookCanvas)return;
 const p=cookPoint(e);pointerPos=p;
 // Only grab the actual utensil/ingredient. Empty-space swipes do nothing.
 const valid=cookStep===1?(p.x>230&&p.x<375&&p.y>280):
 (cookStep===2&&progress===1)?(p.x>165&&p.x<445&&p.y>140&&p.y<270):
 (p.x>45&&p.x<195&&p.y>120&&p.y<260);
 if(!valid)return;

 cookCanvas.setPointerCapture(e.pointerId);drawCook();
}
function moveCookDrag(e){
 if(!dragging)return;
 const p=cookPoint(e);
 if(cookStep===2&&progress===1&&p.x>160&&p.x<445&&p.y>125&&p.y<270)swirlTravel+=Math.hypot(p.x-pointerPos.x,p.y-pointerPos.y);
 pointerPos=p;toolPos=p;drawCook();
}
function endCookDrag(e){
 if(!dragging)return;
 const p=cookPoint(e);pointerPos=p;dragging=false;
 const d=Math.hypot(p.x-dragFrom.x,p.y-dragFrom.y);
 let ok=false;
 if(cookStep===0)ok=p.x>345&&p.y>110&&p.y<270;
 if(cookStep===1)ok=p.x>425&&d>90;
 if(cookStep===2)ok=progress===0?(p.x>185&&p.x<430&&p.y>135&&p.y<255):(swirlTravel>350);
 if(cookStep===3)ok=p.y<115&&d>95;
 if(cookStep===4||cookStep===5)ok=p.x>300&&p.y>115&&p.y<270;
 if(ok)completeGesture();else drawCook();
}
function cookAnimationFrame(t){requestAnimationFrame(cookAnimationFrame);if(cookPanel.style.display==='block'&&cookCanvas?.isConnected){cookAnimTime=t*.001;drawCook()}}
requestAnimationFrame(cookAnimationFrame);

 }
 if(distance2(serveX,serveZ)<2.0){

 }
 const d=camera.position.distanceTo(cat.position);
 say(d<2?'招き猫が静かにこちらを見ている。':'雨が静かに降っている。');
}
// collision against fixed furnishings
const obstacles=[[-5.6,-3.8,-5.5,4.2],[-2.75,-1.55,-4.9,3.6],[.1,1.4,-5.6,4.8],[-5.65,-4.25,-6.3,-4.6]];function free(x,z){if(Math.abs(x)>5.65||Math.abs(z)>7.05)return false;return !obstacles.some(([x1,x2,z1,z2])=>x>x1-.25&&x<x2+.25&&z>z1-.25&&z<z2+.25)}
let mx=0,my=0;const joy=document.querySelector('#joy'),nub=document.querySelector('#nub');function moveStick(e){let r=joy.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/42,dy=(e.clientY-r.top-r.height/2)/42,l=Math.max(1,Math.hypot(dx,dy));mx=dx/l;my=-dy/l;nub.style.transform=`translate(${mx*32}px,${-my*32}px)`}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);moveStick(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))moveStick(e)});function reset(){mx=my=0;nub.style.transform=''}joy.addEventListener('pointerup',reset);joy.addEventListener('pointercancel',reset);
let last=null;renderer.domElement.addEventListener('pointerdown',e=>{last={id:e.pointerId,x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!last||last.id!==e.pointerId)return;yaw-=(e.clientX-last.x)*.0045;pitch=Math.max(-.65,Math.min(.65,pitch-(e.clientY-last.y)*.003));last.x=e.clientX;last.y=e.clientY});renderer.domElement.addEventListener('pointerup',()=>last=null);renderer.domElement.addEventListener('pointercancel',()=>last=null);
document.querySelector('#act').onclick=interactOrder;
const clock=new THREE.Clock();function loop(){let dt=Math.min(clock.getDelta(),.04),s=dt*2.35;let dx=(-Math.sin(yaw)*my+Math.cos(yaw)*mx)*s,dz=(-Math.cos(yaw)*my-Math.sin(yaw)*mx)*s;if(free(camera.position.x+dx,camera.position.z))camera.position.x+=dx;if(free(camera.position.x,camera.position.z+dz))camera.position.z+=dz;camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;for(let i=0;i<steam.length;i++){let p=steam[i];p.position.y=1.72+((performance.now()*.00022+i*.15)%1.55);p.position.x=-4.55+Math.sin(performance.now()*.0008+i)*.12;p.material.opacity=.055+.025*Math.sin(performance.now()*.001+i)}for(let i=0;i<dishSteam.length;i++){let p=dishSteam[i];p.position.y=.19+((performance.now()*.00018+i*.19)% .48);p.material.opacity=.04+.06*(1-(p.position.y-.19)/.48)}const now=performance.now()*.001;// Arrival, seating, eating and departure are driven by actual game state.
if(phase==='arriving'){
 arrivalElapsed+=dt;guest.position.z=Math.min(-1.35,-6.25+arrivalElapsed*1.15);

 if(guest.position.z>=-1.35){seatedPose(true);phase='waiting';guest.position.z=-1.35;guest.position.y=0;guest.rotation.y=-Math.PI/2;setTask('席のお客さんから注文を聞く');say('客「こんばんは……。」注文を聞いてみよう。')}
}else if(phase==='leaving'){

 if(guest.position.z<-6.5){phase='done';guest.visible=false;setTask('最初のお客さんの接客完了！');say('お客さんが帰っていった。雨音だけが残った。')}
}else{guest.position.y=guestRestY+Math.sin(now*1.5)*.004;guest.rotation.y=-Math.PI/2+Math.sin(now*.43)*.012;}
if(phase==='eating'){eatingElapsed+=dt;if(eatingElapsed>12){phase='finished';handMotion.visible=false;eatingBowl.visible=false;setTask('食事終了。お客さんのお会計をする');say('客「ごちそうさまでした。お会計お願いします。」')}}
// Blink every few seconds, with a second quick blink occasionally.
const blinkPhase=now%5.6;
const blink=Math.max(0,1-Math.abs(blinkPhase-.14)/.12);

// A full bite cycle: dip into bowl, pick up noodles, raise chopsticks to lips,

const bite=eatingElapsed%4.5;
const smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};

if(bite<.55)reach=0;
else if(bite<1.55)reach=smooth((bite-.55)/1);
else if(bite<2.35)reach=1;
else if(bite<3.35)reach=1-smooth((bite-2.35)/1);
const isDining=phase==='eating';
if(isDining){
 // Locate the actual world-space mouth, not an approximate fixed point.
 const mouthWorld=guest.localToWorld(new THREE.Vector3(0,1.48,.208));
 eatingPoseStart.set(eatingBowl.position.x+.08,eatingBowl.position.y+.18,eatingBowl.position.z);

 const wrist=eatingPoseStart.clone().lerp(eatingPoseMouth,reach);

 // Make chopsticks' lower tips reach the mouth at the top of the movement.

for(let i=0;i<eatingSteam.length;i++){
